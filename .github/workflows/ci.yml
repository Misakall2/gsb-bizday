name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No dependencies to install: the library is standard-library only.
      # tzdata is present on ubuntu-latest runners; zoneinfo reads it directly.
      - name: Run unit tests
        run: python3 -m unittest discover
